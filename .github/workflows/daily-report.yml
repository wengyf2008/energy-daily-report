name: 能源市场日报（每天8:30自动生成并推送）

on:
  schedule:
    # 北京时间每天早上8:30 (UTC 0:30) + 8:35 兜底
    - cron: "30 0 * * *"
    - cron: "35 0 * * *"
  workflow_dispatch:  # 允许手动触发
  push:
    paths:
      - "energy_report_agent.py"
      - ".github/workflows/daily-report.yml"

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2
          pip install weasyprint requests

      - name: 生成日报并推送
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          set -x
          python3 energy_report_agent.py --push email 2>&1 | tee reports/run.log || true
          echo "✅ 日报生成并推送完成"

      - name: 上传日报存档（含日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            reports/
            reports/run.log
          retention-days: 7
