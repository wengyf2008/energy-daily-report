name: 能源市场日报（每天7:30自动生成并推送）

on:
  schedule:
    # 北京时间每天早上7:30 (UTC 23:30 前一天) + 7:35 兜底
    - cron: "30 23 * * *"
    - cron: "35 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "energy_report_agent.py"
      - ".github/workflows/daily-report.yml"

permissions:
  actions: write

jobs:
  # 保持仓库活跃，防止GitHub因60天不活动而禁用schedule
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 保持定时工作流活跃
        uses: WaterLemons2k/scheduled-workflow-activity-action@v2
        with:
          workflows: "daily-report.yml"

  generate-report:
    needs: keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2
          pip install weasyprint requests

      - name: 生成日报并推送
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          set -x
          python3 energy_report_agent.py --push email || true
          echo "日报生成并推送完成"

      - name: 上传日报存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: reports/
          retention-days: 7
