name: 测试卓创资讯登录抓取

on:
  workflow_dispatch:

jobs:
  test-sci99:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 测试DNS解析
        run: |
          echo "=== DNS 解析测试 ==="
          host passport.sci99.com 2>&1 || true
          host energy.sci99.com 2>&1 || true
          host prices.sci99.com 2>&1 || true
          echo ""

      - name: 测试HTTPS连通性
        run: |
          echo "=== HTTPS 连接测试 ==="
          curl -sI https://passport.sci99.com/ --connect-timeout 10 2>&1 || true
          curl -sI https://energy.sci99.com/ --connect-timeout 10 2>&1 || true
          echo ""

      - name: 尝试登录卓创并抓取LNG价格
        env:
          SCI99_USER: ${{ secrets.SCI99_USER }}
          SCI99_PASS: ${{ secrets.SCI99_PASS }}
        run: |
          python3 << 'PYEOF'
import urllib.request, urllib.parse, http.cookiejar, json, ssl, re

cj = http.cookiejar.CookieJar()
opener = urllib.request.build_opener(
    urllib.request.HTTPSHandler(context=ssl.create_default_context()),
    urllib.request.HTTPCookieProcessor(cj)
)

user = os.environ.get('SCI99_USER', '')
pwd = os.environ.get('SCI99_PASS', '')
print(f'账号长度: {len(user)} | 密码长度: {len(pwd)}')

# 1. 获取首页cookie
try:
    home = opener.open('https://energy.sci99.com/', timeout=15).read().decode()
    print(f'首页访问OK: {len(home)} 字节')
except Exception as e:
    print(f'首页访问失败: {e}')
    sys.exit(1)

# 2. 尝试登录
login_url = 'https://passport.sci99.com/api/login'
login_data = urllib.parse.urlencode({
    'username': user,
    'password': pwd,
}).encode()

req = urllib.request.Request(login_url, data=login_data, headers={
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
    'Content-Type': 'application/x-www-form-urlencoded',
    'Referer': 'https://energy.sci99.com/',
    'Origin': 'https://energy.sci99.com',
})

try:
    resp = opener.open(req, timeout=15)
    result = json.loads(resp.read().decode())
    print(f'登录响应: {json.dumps(result, ensure_ascii=False)[:300]}')
    if isinstance(result, dict) and result.get('code') == 0:
        print('✅ 登录成功!')
    else:
        print(f'⚠️ 登录返回: {result}')
except Exception as e:
    print(f'登录请求失败: {e}')

# 3. 尝试抓取LNG页面
try:
    lng_page = opener.open('https://energy.sci99.com/product/lng', timeout=15).read().decode()
    print(f'LNG页面: {len(lng_page)} 字节')
    # 检查是否有登录态
    login_text = '退出' if '退出' in lng_page else ('登录' if '登录' in lng_page else '未知')
    print(f'登录状态: {login_text}')

    # 尝试提取价格
    prices = re.findall(r'\d{3,5}\s*元', lng_page)[:10]
    print(f'找到价格数据: {prices}')
except Exception as e:
    print(f'LNG页面抓取失败: {e}')
PYEOF
